[project]
name = "ddmo-sose-26"
version = "0.0.0"
description = "Course materials: Data-Driven Modeling and Optimization SoSe 2026 (safety-critical time-series forecasting)"
requires-python = ">=3.13"
dependencies = [
    "spotforecast2-safe>=15.5.0,<26",
    "spotforecast2>=3.4.0,<4",
    "matplotlib",
    "ipykernel",
    "pyarrow",
    "entsoe-py>=0.6",
    "numpy",
    "pandas",
    "lightgbm",
    "scipy",
    # Required by Quarto's jupyter render launcher (not transitive via ipykernel).
    "pyyaml",
    "nbclient",
    "nbformat",
    "jupyter-client",
]

[tool.uv]
# Pre-release pins (e.g. 2.0.1rc2) require explicit allow.
prerelease = "allow"
